name: Pipeline

# Manually triggered for now - this pretends to build & deploy the
# application, then emits a "just deployed" event to the org's event
# handler via the shared notify-deployment action.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        default: staging
        options:
          - dev
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
      artifact-digest: ${{ steps.build.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Build application (fictional)
        id: build
        run: |
          echo "Building example-project-1..."
          ARTIFACT_NAME="example-project-1-${GITHUB_RUN_NUMBER}.tar.gz"
          tar -czf "${ARTIFACT_NAME}" README.md
          DIGEST="sha256:$(sha256sum "${ARTIFACT_NAME}" | cut -d' ' -f1)"
          echo "Build complete: ${ARTIFACT_NAME} (${DIGEST})"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact-digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.build.outputs.artifact-name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.deploy.outputs.version }}
    steps:
      - name: Deploy application (fictional)
        id: deploy
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "Deploying example-project-1 version ${VERSION} to ${{ inputs.environment }}..."
          echo "Deploy complete."
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  notify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify event handler of deployment
        uses: steve-sre-event-playground/shared-workflows-actions/.github/actions/notify-deployment@main
        with:
          application: example-project-1
          environment: ${{ inputs.environment }}
          version: ${{ needs.deploy.outputs.version }}
          commit-sha: ${{ github.sha }}
          artifact-name: ${{ needs.build.outputs.artifact-name }}
          artifact-digest: ${{ needs.build.outputs.artifact-digest }}
          app-id: ${{ secrets.SRE_EVENTMANAGER_APP_ID }}
          app-private-key: ${{ secrets.SRE_EVENTMANAGER_PRIVATE_KEY }}
